# مصدر إضافي (من Claude): ملاحظات مكتوبة لسد فجوات المصادر. الملفات بـ knowledge_base/claude_notes/
# الملف الرئيسي all_notes.md. كل مستند بيبدأ بسطر <!-- id: اسم; topics: a,b --> وبعده # العنوان، وبينقسم حسب ## .
# لإضافة مستند جديد: ألصقه بآخر الملف بنفس الشكل (أو احطه كملف .md ثاني بنفس المجلد) ثم python ingest.py --only SRC017
# النسخ الأصلية المنفصلة محفوظة بمجلد claude_notes/parts/ (ما بتنقرأ).
SRC017:
  kind: local
  title: TechTutor study notes
  domain: general_education
  source_type: authored_notes
  url: https://github.com/CrashingGuru/Sandbox_Training
  description: Original notes covering topics the other sources explain thinly - subnetting math, DNS/TCP details, RAG and LLM practice, debugging, Docker, Linux, security basics, Git recipes, and an Arabic-English glossary.
  license_notes: Original text written by an AI assistant for this project; may contain mistakes, review before relying on it.
  access_method: local markdown files
  path: knowledge_base/claude_notes
  topics: [programming]
  publish: true

