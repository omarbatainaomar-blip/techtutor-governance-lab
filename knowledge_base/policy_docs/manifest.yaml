# قائمة وثائق قاعدة معرفة السياسات (kb_policy_uae)
# file = المجلد/اسم الملف بدون امتداد (الامتداد بينحدد وقت التنزيل: .pdf أو .html)
# download: auto = fetch_policy_docs.py بينزّلها | manual = نزّلها من المتصفح واحفظها بنفس الاسم | bundled = موجودة مع المشروع
# الروابط جُمعت وتم التحقق من أغلبها يوم 2026-11-02 (التفاصيل في notes).
# Known gaps (no official document located on 2026-11-02): KHDA AI-in-schools policy (in development);
# ADEK "Technology and AI Policy" (announced, no public PDF); CAA/MoHESR GenAI guidance for higher education;
# PDPL Executive Regulations.
# binding_scope: federal/emirate = binding law or school policy (can justify SUSPEND); federal_guidance/emirate_guidance =
# official UAE strategy, charter, guide, principles or announcement (non-binding: supports CONDITIONS, never SUSPEND); free_zone = DIFC/ADGM only (comparison, cannot justify SUSPEND);
# international/standard = benchmark only. license: only the ITU reference code is MIT; other documents remain (c) their issuers. These absences are themselves policy-gap evidence for the report.
